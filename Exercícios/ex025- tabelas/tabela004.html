<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Responsiva</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
    
            
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        caption{
            padding: 10px;
            font-size: 1.5em;
            background-color: rgba(128, 128, 128, 0.397);
            border: 1px solid;
        }

        tbody > tr:nth-child(odd){
            background-color: darkgray;
        }

        thead, tfoot{
        background-color: rgba(39, 39, 39, 0.952);
            color: white;
            
            
        }

        thead > tr > th {
            position:sticky;
            top: -1px;
            background-color: rgba(39, 39, 39, 0.952);
            
        }

         th, td {
            border: 1px solid black;
            padding: 10px;

        }






    </style>
</head>
<body>
    <h1>Tabelas em telas pequenas</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium animi placeat fugiat magnam temporibus obcaecati quisquam facere! Blanditiis ratione veritatis quae sunt aliquid eos id quam impedit consequatur, provident eaque.</p>

    <div id="container">












    </div>



</body>
</html>
